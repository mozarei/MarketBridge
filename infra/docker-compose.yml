services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crosslist
    ports:
      - "5432:5432"
    volumes:
      - crosslist_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app

volumes:
  crosslist_pg:
